name: Profile Widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Hero card, skyline, and badges
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          CF_HANDLE: shiblimoon
          LC_HANDLE: moon_drakon
          GFG_HANDLE: drakonn
        run: python3 scripts/generate_stats.py

      - name: GitHub stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&disable_animations=true&show_icons=true&include_all_commits=true&hide_border=true&rank_icon=github&bg_color=0D1117&title_color=A78BFA&icon_color=7C3AED&text_color=C9D1D9&ring_color=7C3AED"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&disable_animations=true&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophies
        continue-on-error: true
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: aura

      - name: Contribution snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            profile/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Activity graph
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: "5100"
          OWNER: ${{ github.repository_owner }}
        run: |
          git clone --depth 1 https://github.com/Ashutosh00710/github-readme-activity-graph.git "$RUNNER_TEMP/activity-graph"
          cd "$RUNNER_TEMP/activity-graph"
          npm ci --no-audit --no-fund
          npx ts-node --transpile-only src/main.ts &
          for i in $(seq 1 60); do curl -s -o /dev/null "http://localhost:$PORT/" && break; sleep 1; done
          curl -fsS "http://localhost:$PORT/graph?username=$OWNER&bg_color=0D1117&color=A78BFA&line=7C3AED&point=EDE9FE&area=true&area_color=4F46E5&hide_border=true&custom_title=Contribution%20Activity" -o "$GITHUB_WORKSPACE/profile/activity-graph.svg"
          # The line rests hidden and relies on a CSS animation to appear. Rest it
          # visible and animate from hidden, so static renderers still show it.
          python3 - "$GITHUB_WORKSPACE/profile/activity-graph.svg" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("stroke-dashoffset: 5000;", "stroke-dashoffset: 0;", 1)
          s = re.sub(r"@keyframes dash\s*\{\s*to\s*\{", "@keyframes dash { from { stroke-dashoffset: 5000; } to {", s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Commit widgets
        run: |
          # This address belongs to no GitHub account, so automated refreshes stay out of
          # the Contributors list and out of the contribution graph.
          git config user.name "profile-widgets"
          git config user.email "profile-widgets@moon-drakon.invalid"
          git add profile/*.svg profile/*.json
          git commit -m "chore: refresh profile widgets" || exit 0
          git push
